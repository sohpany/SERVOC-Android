plugins { id 'com.android.application' }

android {
    namespace 'com.hazrob.miniremote'
    compileSdk 36

    defaultConfig {
        applicationId 'com.hazrob.miniremote'
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName '1.0-temp'
    }

    buildTypes {
        debug { minifyEnabled false }
        release { minifyEnabled false }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
