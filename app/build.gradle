plugins { id 'com.android.application' }

android {
    namespace 'com.servoc.app'
    compileSdk 36

    defaultConfig {
        applicationId 'com.servoc.app'
        minSdk 26
        targetSdk 36
        versionCode 5
        versionName '0.4.0'
    }

    signingConfigs {
        prototype {
            storeFile rootProject.file('signing/hazrob-prototype.jks')
            storePassword 'hazrob-prototype'
            keyAlias 'hazrob-prototype'
            keyPassword 'hazrob-prototype'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.prototype
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.prototype
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
}
