plugins { id 'com.android.application' }

android {
    namespace 'com.servoc.app'
    compileSdk 36

    buildFeatures { buildConfig true }

    defaultConfig {
        applicationId 'com.servoc.app'
        minSdk 26
        targetSdk 36
        versionCode 20
        versionName '0.10.0'
        buildConfigField 'String', 'APP_UPDATE_MANIFEST_URL', '"https://hazrob-app-updates.onrender.com/app-update.json"'
        // Stable read-only endpoints; developer mode alone may override the ChemCore source.
        buildConfigField 'String', 'CHEMCORE_LIBRARY_MANIFEST_URL', '"https://hazrob-app-updates.onrender.com/chemcore/manifest.json"'
    }

    signingConfigs {
        prototype {
            storeFile rootProject.file('signing/hazrob-prototype.jks')
            storePassword 'hazrob-prototype'
            keyAlias 'hazrob-prototype'
            keyPassword 'hazrob-prototype'
        }
    }

    buildTypes {
        debug { signingConfig signingConfigs.prototype }
        release { minifyEnabled false; signingConfig signingConfigs.prototype }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.core:core:1.15.0'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
}
