plugins { id 'com.android.application' }

import java.security.MessageDigest
import java.util.zip.ZipFile

final String HAZROB_FLAMMABILITY_SHA256 = '457b9a1d88b8c54d8863772ca3741f8d2afd152ebd0a9fc007ccb106f4d50434'
final String HAZROB_ACCEPTED_APK_URL = 'https://hazrob-0101-build.onrender.com/HazRob-0.10.1-TEST.apk'
final String HAZROB_ACCEPTED_APK_ASSET = 'assets/generated/flammability/niosh_npg_flammability.json'
def generatedHazrobAssets = file("$buildDir/generated/hazrobAssets")
def generatedFlammability = file("$generatedHazrobAssets/generated/flammability/niosh_npg_flammability.json")
def sourceFlammability = file('src/main/assets/generated/flammability/niosh_npg_flammability.json')

def sha256File = { File f ->
    MessageDigest md = MessageDigest.getInstance('SHA-256')
    f.withInputStream { input -> byte[] buf = new byte[8192]; int n; while ((n=input.read(buf)) > 0) md.update(buf,0,n) }
    md.digest().collect { String.format('%02x', it & 0xff) }.join()
}

tasks.register('applyHazRobBranding', Exec) {
    workingDir rootProject.projectDir
    commandLine 'python3', 'tools/apply_hazrob_branding.py'
    inputs.file rootProject.file('branding/hazrob_sensing_logo_96.webp.b64')
    inputs.file rootProject.file('tools/apply_hazrob_branding.py')
    inputs.file rootProject.file('tools/hazrob_hr069_r1_png.py')
    outputs.file file('src/main/res/drawable/ic_hazrob_app.webp')
    outputs.file file('src/main/res/drawable/ic_hazrob_hr069_r1.png')
    outputs.file file('src/main/assets/hazrob_hr069_r1_logo.png')
}

// Independently versioned ChemCore Stable-channel pre-release embedded into each
// 0.10.2 HR069-R1 diagnostic APK, alongside (not instead of) local user sessions.
tasks.register('prepareHr069EmbeddedStable', Exec) {
    workingDir rootProject.projectDir
    commandLine 'python3', 'tools/build_hr069_embedded_stable.py',
            '--out-dir', file("$buildDir/generated/hazrobAssets/generated/chemcore/embedded_stable").absolutePath
    inputs.files rootProject.file('tools/build_hr069_embedded_stable.py'),
            rootProject.file('tools/build_hr069_research_priors.py'),
            rootProject.file('tools/build_chemcore_stable_snapshot.py'),
            rootProject.file('research_data/hr069_analytical_library/mq_research_curves_43.json'),
            rootProject.file('app/src/main/assets/generated/chemcore/molecular_descriptors.json'),
            rootProject.file('app/src/main/assets/generated/chemcore/unresolved_curation.json')
    outputs.dir file("$buildDir/generated/hazrobAssets/generated/chemcore/embedded_stable")
}

tasks.register('prepareHazRobFlammabilitySeed') {
    outputs.file(generatedFlammability)
    doLast {
        generatedFlammability.parentFile.mkdirs()
        if (sourceFlammability.exists()) {
            generatedFlammability.bytes = sourceFlammability.bytes
        } else {
            // Release-build recovery path for the already accepted 0.10.1 controlled seed.
            // This is not an application/library update endpoint. P4 migration of update
            // distribution is GitHub-only; this legacy build-time recovery is reviewed
            // separately before P13 and remains content-addressed by SHA-256.
            File acceptedApk = file("$buildDir/accepted/HazRob-0.10.1-accepted.apk")
            acceptedApk.parentFile.mkdirs()
            Exception last = null
            for (int attempt=1; attempt<=3; attempt++) {
                try {
                    URLConnection c = new URL(HAZROB_ACCEPTED_APK_URL).openConnection()
                    c.setConnectTimeout(20_000); c.setReadTimeout(90_000)
                    c.setRequestProperty('User-Agent','HazRob-0.10.1-content-addressed-build')
                    c.inputStream.withCloseable { input -> acceptedApk.withOutputStream { output -> output << input } }
                    ZipFile z = new ZipFile(acceptedApk)
                    try {
                        def entry = z.getEntry(HAZROB_ACCEPTED_APK_ASSET)
                        if (entry == null) throw new GradleException("Accepted APK is missing controlled asset: $HAZROB_ACCEPTED_APK_ASSET")
                        z.getInputStream(entry).withCloseable { input -> generatedFlammability.withOutputStream { output -> output << input } }
                    } finally { z.close() }
                    last = null; break
                } catch (Exception e) {
                    last=e
                    if (attempt<3) sleep(1000L*attempt)
                } finally {
                    if (acceptedApk.exists()) acceptedApk.delete()
                }
            }
            if (last != null) throw new GradleException('Unable to recover controlled HazRob flammability snapshot from accepted APK',last)
        }
        String actual=sha256File(generatedFlammability)
        if (!HAZROB_FLAMMABILITY_SHA256.equalsIgnoreCase(actual)) throw new GradleException("HazRob flammability seed SHA-256 mismatch: $actual")
        println "HazRob flammability seed verified: $actual"
    }
}

android {
    namespace 'com.servoc.app'
    compileSdk 36

    buildFeatures { buildConfig true }

    defaultConfig {
        applicationId 'com.servoc.app'
        minSdk 26
        targetSdk 36
        versionCode 31
        versionName '0.10.2'

        // P4 policy: application and ChemCore update distribution is GitHub-only.
        // Keep fail-closed until a PUBLIC read-only HazRob GitHub distribution repository
        // is created. The canonical scientific repository HazRob/build-harness is private
        // and must never force ordinary users to carry a GitHub credential.
        buildConfigField 'String', 'APP_UPDATE_MANIFEST_URL', '""'
        buildConfigField 'String', 'CHEMCORE_LIBRARY_MANIFEST_URL', '""'
    }

    sourceSets { main { assets.srcDir generatedHazrobAssets } }

    signingConfigs {
        prototype {
            storeFile rootProject.file('signing/hazrob-prototype.jks')
            storePassword 'hazrob-prototype'
            keyAlias 'hazrob-prototype'
            keyPassword 'hazrob-prototype'
        }
    }

    buildTypes {
        debug { signingConfig signingConfigs.prototype }
        release { minifyEnabled false; signingConfig signingConfigs.prototype }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

tasks.named('preBuild').configure { dependsOn tasks.named('applyHazRobBranding'); dependsOn tasks.named('prepareHazRobFlammabilitySeed'); dependsOn tasks.named('prepareHr069EmbeddedStable') }

dependencies {
    implementation 'androidx.core:core:1.15.0'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
}
