name = "hazrob-video-relay"
main = "src/index.js"
compatibility_date = "2026-09-01"

[durable_objects]
bindings = [
  { name = "VIDEO_ROOMS", class_name = "VideoRoom" }
]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["VideoRoom"]

# Required secrets (do not commit values):
#   wrangler secret put PUBLISH_TOKEN
#   wrangler secret put VIEW_TOKEN
