name: RETIRED - Legacy ChemCore molecular seed writer - DO NOT WRITE

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retired-workflow:
    runs-on: ubuntu-latest
    steps:
      - name: Fail closed - controlled scientific-data change required
        shell: bash
        run: |
          echo "::error::This legacy molecular-seed writer is retired under CR-20261004-009."
          echo "No generated scientific dataset may be committed without a registered and approved HazRob Change Record."
          echo "Current authority: HazRob/build-harness/CURRENT_RELEASE_AUTHORITY.md"
          echo "Policy: HazRob/build-harness/docs/HAZROB_MANDATORY_CHANGE_CONTROL_AND_RELEASE_POLICY_2026-10-04.md"
          exit 1
