name: Build ChemCore Molecular Seed

on:
  push:
    branches:
      - dev/hazrob-0.10.1
    paths:
      - tools/build_chemcore_molecular_seed.py
      - tools/build_chemcore_unresolved_curation.py
      - .github/workflows/chemcore-molecular-seed.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: chemcore-molecular-seed-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-molecular-seed:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout 0.10.1 integration branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build provenance-rich PubChem seed
        run: |
          python3 tools/build_chemcore_molecular_seed.py \
            --retries 5 \
            --backoff 1.0 \
            --delay 0.25

      - name: Validate generated seed and manifest
        run: |
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          data_path=Path('app/src/main/assets/generated/chemcore/molecular_descriptors.json')
          manifest_path=Path('app/src/main/assets/generated/chemcore/manifest.json')
          data=json.loads(data_path.read_text(encoding='utf-8'));manifest=json.loads(manifest_path.read_text(encoding='utf-8'))
          assert data['record_count']==652;assert manifest['record_count']==652;assert data['error_count']==0
          assert data['resolved_count']==615;assert data['unresolved_count']==37
          assert data['resolved_count']+data['unresolved_count']==652
          actual=hashlib.sha256(data_path.read_bytes()).hexdigest();assert actual==manifest['sha256']
          assert len(data['records'])==652;assert all(r.get('status') in {'RESOLVED','UNRESOLVED'} for r in data['records'])
          assert data['interpretation'].startswith('Molecular/structural knowledge only')
          print('ChemCore molecular seed:',data['record_count'],'resolved',data['resolved_count'],'unresolved',data['unresolved_count'],'SHA-256',actual)
          PY

      - name: Curate unresolved occupational/material identities without molecular guessing
        run: |
          python3 tools/build_chemcore_unresolved_curation.py
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('app/src/main/assets/generated/chemcore/unresolved_curation.json')
          d=json.loads(p.read_text(encoding='utf-8'))
          assert d['schema']=='chemcore-unresolved-curation-v1'
          assert d['record_count']==37, d['record_count']
          assert sum(d['entity_type_counts'].values())==37
          assert all(r['molecular_qspr_eligible'] is False for r in d['records'])
          assert all(r['entity_type'] in {'PURE_COMPOUND','MIXTURE','MATERIAL','ISOMER_GROUP','OCCUPATIONAL_CATEGORY'} for r in d['records'])
          print('Unresolved curation:',d['entity_type_counts'])
          PY

      - name: Commit pinned generated dataset safely
        run: |
          set -euo pipefail
          TARGET=dev/hazrob-0.10.1
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/assets/generated/chemcore/molecular_descriptors.json \
                  app/src/main/assets/generated/chemcore/manifest.json \
                  app/src/main/assets/generated/chemcore/unresolved_curation.json
          if git diff --cached --quiet; then
            echo "Molecular seed/curation already pinned; no changes."
            exit 0
          fi
          git commit -m "data(chemcore): pin PubChem seed and unresolved identity curation"
          for attempt in 1 2 3; do
            git fetch origin "$TARGET"
            if git rebase "origin/$TARGET"; then
              if git push origin "HEAD:$TARGET"; then exit 0; fi
            else
              git rebase --abort || true
              echo "Rebase conflict while pinning generated data; refusing to overwrite branch."
              exit 1
            fi
            echo "Push raced with another commit; retrying ($attempt/3)."
            sleep $((attempt*2))
          done
          echo "Unable to pin molecular seed after three safe retries."
          exit 1

      - name: Upload molecular seed audit artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chemcore-molecular-seed-0.10.1
          if-no-files-found: warn
          retention-days: 30
          path: |
            app/src/main/assets/generated/chemcore/molecular_descriptors.json
            app/src/main/assets/generated/chemcore/manifest.json
            app/src/main/assets/generated/chemcore/unresolved_curation.json
