name: Build HazRob Firmware
on:
  workflow_dispatch:
  push:
    branches: ['dev/**','fix/**',main]
    paths:
      - 'firmware/**'
      - 'tools/audit_0101_firmware_baseline.py'
      - '.github/workflows/build-firmware.yml'

permissions:
  contents: read

jobs:
  compile-firmware:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Validate firmware baseline contract
        run: python3 tools/audit_0101_firmware_baseline.py

      - uses: arduino/setup-arduino-cli@v2

      - name: Install pinned ESP32 core 3.3.11
        run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@3.3.11

      - name: Compile Main ESP32
        run: |
          mkdir -p build/main
          arduino-cli compile --fqbn esp32:esp32:esp32:PartitionScheme=huge_app --warnings all --output-dir build/main firmware/HazRob 2>&1 | tee build/main.log

      - name: Compile ESP32-CAM
        run: |
          mkdir -p build/camera
          arduino-cli compile --fqbn esp32:esp32:esp32cam --warnings all --output-dir build/camera firmware/HazRob-CAM 2>&1 | tee build/camera.log

      - name: Package canonical firmware
        run: |
          set -euo pipefail
          mkdir -p HazRob-0.10.1-FIRMWARE/Main HazRob-0.10.1-FIRMWARE/CAM
          cp build/main/*.bin HazRob-0.10.1-FIRMWARE/Main/
          cp build/camera/*.bin HazRob-0.10.1-FIRMWARE/CAM/
          cp firmware/FIRMWARE_BASELINE_0.10.1.md HazRob-0.10.1-FIRMWARE/
          find HazRob-0.10.1-FIRMWARE -type f -name '*.bin' -print0 | sort -z | xargs -0 sha256sum > HazRob-0.10.1-FIRMWARE/SHA256SUMS.txt
          printf '%s\n'             'HazRob 0.10.1 canonical firmware'             'Erase both ESP32 flash memories before programming when replacing an unknown prior build.'             'Main must advertise HazRob at 192.168.4.1.'             'Camera is STA-only at 192.168.4.2 and must never advertise ESP_*.'             'Verify http://192.168.4.2/status and http://192.168.4.2:81/stream after flashing.'             > HazRob-0.10.1-FIRMWARE/README-FLASH.txt

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: HazRob-0.10.1-FIRMWARE-${{ github.sha }}
          path: HazRob-0.10.1-FIRMWARE/
          if-no-files-found: error
          retention-days: 90
