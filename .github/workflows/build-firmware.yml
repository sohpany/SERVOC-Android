name: Build HazRob Firmware

on:
  workflow_dispatch:
  push:
    branches: ['dev/**','fix/**',main]
    paths: ['firmware/**','tools/audit_0101_integration_contract.py','.github/workflows/build-firmware.yml']

permissions: { contents: write }

jobs:
  compile-firmware:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Validate HazRob 0.10.1 cross-component contract
        run: python3 tools/audit_0101_integration_contract.py

      - uses: arduino/setup-arduino-cli@v2
      - name: Install ESP32 core
        run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32

      - name: Compile master ESP32
        shell: bash
        run: |
          set -o pipefail
          mkdir -p build/master
          arduino-cli compile --fqbn esp32:esp32:esp32:PartitionScheme=huge_app --warnings all --output-dir build/master firmware/HazRob 2>&1 | tee build/master-size.log

      - name: Compile ESP32-CAM
        shell: bash
        run: |
          set -o pipefail
          mkdir -p build/camera
          arduino-cli compile --fqbn esp32:esp32:esp32cam --warnings all --output-dir build/camera firmware/HazRob-CAM 2>&1 | tee build/camera-size.log

      - name: Enforce firmware flash headroom
        shell: bash
        run: |
          python3 - <<'PY'
          import re, pathlib, sys
          pct_target=70.0
          pct_hard={'master':80.0,'camera':80.0}
          byte_target={'master':1_000_000,'camera':1_150_000}
          byte_hard={'master':1_150_000,'camera':1_300_000}
          for k,limit in pct_hard.items():
              txt=pathlib.Path(f'build/{k}-size.log').read_text(errors='ignore')
              m=re.search(r'Sketch uses\s+([\d,]+)\s+bytes\s*\((\d+(?:\.\d+)?)%\)',txt)
              if not m:
                  print(f'{k}: compiler size line not found'); sys.exit(1)
              size=int(m.group(1).replace(',','')); pct=float(m.group(2))
              pstate='TARGET' if pct<=pct_target else 'HEADROOM-WARNING'
              bstate='TARGET' if size<=byte_target[k] else 'BINARY-WARNING'
              print(f'{k}: {size} bytes; flash={pct:.1f}% target<={pct_target:.1f}% hard<={limit:.1f}% [{pstate}; {bstate}]')
              if pct>limit: sys.exit(f'{k} exceeds 0.10.1 partition headroom ceiling')
              if size>byte_hard[k]: sys.exit(f'{k} exceeds 0.10.1 absolute binary ceiling')
          PY

      - name: Remove optional local secret headers before source packaging
        run: rm -f firmware/HazRob/RemoteCloudSecrets.h firmware/HazRob-CAM/RemoteVideoSecrets.h

      - name: Create source ZIPs
        run: |
          cd firmware
          zip -qr ../HazRob-ESP32-v0.10.1-source.zip HazRob
          zip -qr ../HazRob-ESP32-CAM-v0.10.1-source.zip HazRob-CAM
          cd ..
          sha256sum HazRob-ESP32-v0.10.1-source.zip HazRob-ESP32-CAM-v0.10.1-source.zip > firmware-source-sha256.txt

      - name: Upload firmware binaries and size logs
        uses: actions/upload-artifact@v4
        with:
          name: HazRob-v0.10.1-firmware
          path: |
            build/master/*.bin
            build/camera/*.bin
            build/*-size.log
          if-no-files-found: error
          retention-days: 30

      - name: Upload source ZIPs
        uses: actions/upload-artifact@v4
        with:
          name: HazRob-v0.10.1-firmware-sources
          path: |
            HazRob-ESP32-v0.10.1-source.zip
            HazRob-ESP32-CAM-v0.10.1-source.zip
            firmware-source-sha256.txt
          if-no-files-found: error
          retention-days: 90

      - name: Publish source ZIPs to update distribution
        if: github.ref == 'refs/heads/release/hazrob-0.10.1-ready'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin app-update-distribution
          rm -rf /tmp/hazrob-dist
          git worktree add -B app-update-distribution /tmp/hazrob-dist origin/app-update-distribution
          mkdir -p /tmp/hazrob-dist/public/firmware
          cp HazRob-ESP32-v0.10.1-source.zip HazRob-ESP32-CAM-v0.10.1-source.zip firmware-source-sha256.txt /tmp/hazrob-dist/public/firmware/
          git -C /tmp/hazrob-dist add public/firmware
          git -C /tmp/hazrob-dist diff --cached --quiet || {
            git -C /tmp/hazrob-dist commit -m 'dist(firmware): publish HazRob 0.10.1 source ZIPs'
            git -C /tmp/hazrob-dist push origin HEAD:app-update-distribution
          }
