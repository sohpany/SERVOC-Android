name: Build HazRob Firmware

on:
  workflow_dispatch:
  push:
    branches:
      - 'dev/**'
      - 'fix/**'
      - main
    paths:
      - 'firmware/**'
      - '.github/workflows/build-firmware.yml'

permissions:
  contents: read

jobs:
  compile-firmware:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      - name: Install ESP32 core
        run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32

      - name: Install master firmware libraries
        run: |
          arduino-cli lib update-index
          arduino-cli lib install "Adafruit ADS1X15"
          arduino-cli lib install "Adafruit BME280 Library"
          arduino-cli lib install "Adafruit BMP280 Library"

      - name: Compile HazRob master ESP32
        run: |
          mkdir -p build/master
          arduino-cli compile --fqbn esp32:esp32:esp32doit-devkit-v1 --warnings all --output-dir build/master firmware/HazRob

      - name: Compile HazRob ESP32-CAM
        run: |
          mkdir -p build/camera
          arduino-cli compile --fqbn esp32:esp32:esp32cam --warnings all --output-dir build/camera firmware/HazRob-CAM

      - name: Upload firmware binaries
        uses: actions/upload-artifact@v4
        with:
          name: HazRob-v0.10.0-rc1-firmware
          path: |
            build/master/*.bin
            build/camera/*.bin
          if-no-files-found: error
          retention-days: 30
