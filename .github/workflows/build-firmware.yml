name: HazRob Firmware Release Hold

# P2-P12 development guard.
# Main/CAM release binaries and ZIP packages are deliberately disabled while the
# deferred 0.10.2 / HR069 package is under development. P13 must explicitly restore
# artifact production from the final qualified source SHA.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-hold:
    runs-on: ubuntu-latest
    steps:
      - name: Confirm deferred release hold
        run: |
          echo "HazRob 0.10.2 / HR069 firmware artifact production is locked during P2-P12."
          echo "No Main/CAM binary or firmware ZIP is packaged or uploaded by this workflow."
          echo "Artifact production may be restored only after P12 completion and explicit P13 unlock."
