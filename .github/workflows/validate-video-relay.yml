name: Validate HazRob Video Relay

on:
  push:
    branches: [ dev/hazrob-0.9 ]
    paths:
      - 'remote/video-relay/**'
      - '.github/workflows/validate-video-relay.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: remote/video-relay
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: remote/video-relay/package-lock.json

      - name: Install dependencies
        run: npm install --package-lock-only && npm ci

      - name: Syntax check
        run: npm run check
