# RC2 artifact refresh: build the current branch head.
name: Build HazRob RC2 Test APK

on:
  workflow_dispatch:
  push:
    branches:
      - 'release/hazrob-0.10.2-rc2'
    paths:
      - 'app/**'
      - 'tools/audit_0102_rc2_runtime_contract.py'
      - 'signing/hazrob-prototype.jks.b64'
      - '*.gradle'
      - 'gradle.properties'
      - '.github/workflows/build-rc2-test-apk.yml'

permissions:
  contents: read

concurrency:
  group: hazrob-rc2-test-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout RC2 source
        uses: actions/checkout@v4

      - name: Validate current RC2 runtime contract
        run: python3 tools/audit_0102_rc2_runtime_contract.py

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Use preinstalled Android SDK
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "/usr/local/lib/android/sdk/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "/usr/local/lib/android/sdk/platform-tools" >> "$GITHUB_PATH"

      - name: Install Android platform and build tools
        run: |
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null || true
          /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.5.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Restore prototype signing key for device-test build
        run: |
          set -euo pipefail
          base64 -d signing/hazrob-prototype.jks.b64 > signing/hazrob-prototype.jks
          chmod 600 signing/hazrob-prototype.jks

      - name: Run Android unit tests and ChemCore reference challenge
        run: gradle --no-daemon :app:testDebugUnitTest

      - name: Stage ChemCore reference simulation report
        run: |
          set -euo pipefail
          REPORT="$(find . -name chemcore-reference-simulation.json -type f -print -quit)"
          test -n "$REPORT"
          cp "$REPORT" ChemCore-reference-simulation.json
          echo "===== CHEMCORE REFERENCE SIMULATION ====="
          cat ChemCore-reference-simulation.json

      - name: Upload ChemCore reference simulation
        uses: actions/upload-artifact@v4
        with:
          name: ChemCore-reference-simulation
          path: ChemCore-reference-simulation.json
          if-no-files-found: error
          retention-days: 14

      - name: Build installable debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify and stage APK
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          /usr/local/lib/android/sdk/build-tools/36.0.0/apksigner verify --verbose "$APK"
          cp "$APK" HazRob-0.10.2-HR069-RC2-test.apk
          sha256sum HazRob-0.10.2-HR069-RC2-test.apk

      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: HazRob-0.10.2-HR069-RC2-test
          path: HazRob-0.10.2-HR069-RC2-test.apk
          if-no-files-found: error
          retention-days: 14

      - name: Remove temporary signing material
        if: always()
        run: |
          rm -f signing/hazrob-prototype.jks
          rm -f HazRob-0.10.2-HR069-RC2-test.apk
          rm -f ChemCore-reference-simulation.json
