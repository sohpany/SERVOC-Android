name: Deploy HazRob Video Relay

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate deployment secrets
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          HAZROB_VIDEO_PUBLISH_TOKEN: ${{ secrets.HAZROB_VIDEO_PUBLISH_TOKEN }}
          HAZROB_VIDEO_VIEW_TOKEN: ${{ secrets.HAZROB_VIDEO_VIEW_TOKEN }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$HAZROB_VIDEO_PUBLISH_TOKEN"
          test -n "$HAZROB_VIDEO_VIEW_TOKEN"

      - name: Deploy Worker and Durable Object
        working-directory: remote/video-relay
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy

      - name: Install publisher token
        working-directory: remote/video-relay
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TOKEN: ${{ secrets.HAZROB_VIDEO_PUBLISH_TOKEN }}
        shell: bash
        run: printf '%s' "$TOKEN" | npx --yes wrangler@4 secret put PUBLISH_TOKEN

      - name: Install viewer token
        working-directory: remote/video-relay
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TOKEN: ${{ secrets.HAZROB_VIDEO_VIEW_TOKEN }}
        shell: bash
        run: printf '%s' "$TOKEN" | npx --yes wrangler@4 secret put VIEW_TOKEN
