# CR-20261004-004
# Validation artifacts are WORKING/UNAPPROVED and never release authority by themselves.
name: Validate HazRob 0.10.2 HR069 Development

on:
  workflow_dispatch:
  push:
    branches:
      - 'release/hazrob-0.10.2'
      - 'release/hazrob-0.10.2-rc2'
    paths:
      - 'app/**'
      - 'firmware/**'
      - 'tools/**'
      - 'research_data/**'
      - '.github/workflows/validate-0102-hr069-development.yml'

permissions:
  contents: read

concurrency:
  group: hazrob-0102-hr069-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-and-android-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout current HR069 source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Current 0.10.2 HR069 RC2 source contracts
        run: |
          set -euo pipefail
          python3 tools/audit_0102_rc2_runtime_contract.py
          python3 tools/audit_hr069_operator_ui_contract.py
          python3 tools/audit_hr069_chemical_coverage.py --check
          python3 tools/audit_0103_measurement_foundation.py
          python3 tools/audit_0104_chemcore_library.py
          python3 tools/audit_0105_analytical_engines.py
          python3 tools/audit_0106_confidence_fusion.py

      - name: Replay actual HR069 firmware logic on host (Echo IR direct-BME drive)
        run: |
          set -euo pipefail
          python3 tools/test_hr069_r1_hardware_host.py

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Use preinstalled Android SDK
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "/usr/local/lib/android/sdk/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "/usr/local/lib/android/sdk/platform-tools" >> "$GITHUB_PATH"

      - name: Install Android platform only
        run: |
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null || true
          /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.5.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Run current Android unit tests
        run: gradle --no-daemon :app:testDebugUnitTest

  firmware-compile-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout current HR069 source
        uses: actions/checkout@v4

      - name: Set up Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      - name: Install pinned ESP32 core 3.3.11
        run: |
          set -euo pipefail
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@3.3.11

      - name: Compile current Main ESP32 HR069
        run: |
          mkdir -p build/hr069-main
          arduino-cli compile --fqbn esp32:esp32:esp32:PartitionScheme=huge_app --warnings all --output-dir build/hr069-main firmware/HazRob

      - name: Compile current ESP32-CAM HR069
        run: |
          mkdir -p build/hr069-cam
          arduino-cli compile --fqbn esp32:esp32:esp32cam --warnings all --output-dir build/hr069-cam firmware/HazRob-CAM

      - name: Package WORKING UNAPPROVED Main ESP32 firmware
        shell: bash
        run: |
          set -euo pipefail
          PKG=dist/HazRob-0.10.2-HR069-ESP32
          ZIP="HazRob-0.10.2-HR069-ESP32-WORKING-${GITHUB_RUN_NUMBER}-${GITHUB_SHA}.zip"
          mkdir -p "$PKG/source" "$PKG/bin"
          cp -R firmware/HazRob/. "$PKG/source/"
          find build/hr069-main -maxdepth 1 -type f \( -name '*.bin' -o -name '*.elf' -o -name '*.map' \) -exec cp {} "$PKG/bin/" \;
          test -n "$(find "$PKG/bin" -name '*.bin' -print -quit)"
          cat > "$PKG/BUILD_INFO.txt" <<EOF
          HazRob 0.10.2 / HR069 - Main ESP32
          Authority status: WORKING_UNAPPROVED_NON_AUTHORITATIVE
          Commit: $GITHUB_SHA
          Workflow run ID: $GITHUB_RUN_ID
          Workflow run number: $GITHUB_RUN_NUMBER
          Change record: CR-20261004-004
          Board FQBN: esp32:esp32:esp32:PartitionScheme=huge_app
          ESP32 Arduino core: 3.3.11
          Generated by: Validate HazRob 0.10.2 HR069 Development
          EOF
          (cd "$PKG" && find bin -type f -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt)
          (cd dist && zip -qr "$ZIP" HazRob-0.10.2-HR069-ESP32)
          sha256sum "dist/$ZIP"

      - name: Package WORKING UNAPPROVED ESP32-CAM firmware
        shell: bash
        run: |
          set -euo pipefail
          PKG=dist/HazRob-0.10.2-HR069-ESP32-CAM
          ZIP="HazRob-0.10.2-HR069-ESP32-CAM-WORKING-${GITHUB_RUN_NUMBER}-${GITHUB_SHA}.zip"
          mkdir -p "$PKG/source" "$PKG/bin"
          cp -R firmware/HazRob-CAM/. "$PKG/source/"
          find build/hr069-cam -maxdepth 1 -type f \( -name '*.bin' -o -name '*.elf' -o -name '*.map' \) -exec cp {} "$PKG/bin/" \;
          test -n "$(find "$PKG/bin" -name '*.bin' -print -quit)"
          cat > "$PKG/BUILD_INFO.txt" <<EOF
          HazRob 0.10.2 / HR069 - ESP32-CAM
          Authority status: WORKING_UNAPPROVED_NON_AUTHORITATIVE
          Commit: $GITHUB_SHA
          Workflow run ID: $GITHUB_RUN_ID
          Workflow run number: $GITHUB_RUN_NUMBER
          Change record: CR-20261004-004
          Board FQBN: esp32:esp32:esp32cam
          ESP32 Arduino core: 3.3.11
          Generated by: Validate HazRob 0.10.2 HR069 Development
          EOF
          (cd "$PKG" && find bin -type f -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt)
          (cd dist && zip -qr "$ZIP" HazRob-0.10.2-HR069-ESP32-CAM)
          sha256sum "dist/$ZIP"

      - name: Record firmware validation manifest
        shell: bash
        run: |
          set -euo pipefail
          MAIN="dist/HazRob-0.10.2-HR069-ESP32-WORKING-${GITHUB_RUN_NUMBER}-${GITHUB_SHA}.zip"
          CAM="dist/HazRob-0.10.2-HR069-ESP32-CAM-WORKING-${GITHUB_RUN_NUMBER}-${GITHUB_SHA}.zip"
          test -s "$MAIN"
          test -s "$CAM"
          MAIN_SHA=$(sha256sum "$MAIN" | awk '{print $1}')
          CAM_SHA=$(sha256sum "$CAM" | awk '{print $1}')
          {
            echo "authority_status=WORKING_UNAPPROVED_NON_AUTHORITATIVE"
            echo "product=HazRob-0.10.2"
            echo "engineering_revision=HR069"
            echo "source_repository=${GITHUB_REPOSITORY}"
            echo "source_branch=${GITHUB_REF_NAME}"
            echo "source_sha=${GITHUB_SHA}"
            echo "workflow_run_id=${GITHUB_RUN_ID}"
            echo "workflow_run_number=${GITHUB_RUN_NUMBER}"
            echo "change_record=CR-20261004-004"
            echo "main_package=$(basename "$MAIN")"
            echo "main_package_sha256=$MAIN_SHA"
            echo "cam_package=$(basename "$CAM")"
            echo "cam_package_sha256=$CAM_SHA"
            echo "promotion_rule=Validation artifacts only; not release authority without a separate completed approval/promotion record."
          } > dist/FIRMWARE-BUILD-MANIFEST.txt
          cat dist/FIRMWARE-BUILD-MANIFEST.txt

      - name: Upload WORKING UNAPPROVED Main ESP32 package
        uses: actions/upload-artifact@v4
        with:
          name: HazRob-0.10.2-HR069-ESP32-WORKING-UNAPPROVED-${{ github.run_number }}-${{ github.sha }}
          path: |
            dist/HazRob-0.10.2-HR069-ESP32-WORKING-${{ github.run_number }}-${{ github.sha }}.zip
            dist/FIRMWARE-BUILD-MANIFEST.txt
          if-no-files-found: error
          retention-days: 14

      - name: Upload WORKING UNAPPROVED ESP32-CAM package
        uses: actions/upload-artifact@v4
        with:
          name: HazRob-0.10.2-HR069-ESP32-CAM-WORKING-UNAPPROVED-${{ github.run_number }}-${{ github.sha }}
          path: |
            dist/HazRob-0.10.2-HR069-ESP32-CAM-WORKING-${{ github.run_number }}-${{ github.sha }}.zip
            dist/FIRMWARE-BUILD-MANIFEST.txt
          if-no-files-found: error
          retention-days: 14

# Current-HR069 validation only. Historical revision-specific source contracts remain in the
# repository for provenance but are not release gates for the current RC2 architecture.
# No release publication or deploy step is performed here. Firmware artifacts are WORKING,
# uniquely source-bound validation evidence and are never authority by themselves.
