name: Validate HazRob 0.10.2 HR069 Development

on:
  workflow_dispatch:
  push:
    branches:
      - 'release/hazrob-0.10.2'
    paths:
      - 'app/**'
      - 'firmware/**'
      - 'tools/**'
      - '.github/workflows/validate-0102-hr069-development.yml'

permissions:
  contents: read

concurrency:
  group: hazrob-0102-hr069-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-and-android-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Canonical source contracts
        run: |
          set -euo pipefail
          python3 tools/audit_0102_release_contract.py
          python3 tools/audit_hr061_direct_first_contract.py
          python3 tools/audit_0101_integration_contract.py
          python3 tools/audit_0101_motion_contract.py
          python3 tools/audit_hr047_gas_safety_contract.py
          python3 tools/audit_0103_measurement_foundation.py
          python3 tools/audit_0104_chemcore_library.py
          python3 tools/audit_0105_analytical_engines.py
          python3 tools/audit_0106_confidence_fusion.py

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform only
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.5.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Run Android unit and contract tests only
        run: gradle --no-daemon :app:testDebugUnitTest

  firmware-compile-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4

      - name: Validate firmware baseline contract
        run: python3 tools/audit_0101_firmware_baseline.py

      - name: Set up Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      - name: Install pinned ESP32 core 3.3.11
        run: |
          set -euo pipefail
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@3.3.11

      - name: Compile Main ESP32 HR069 for validation only
        run: arduino-cli compile --fqbn esp32:esp32:esp32:PartitionScheme=huge_app --warnings all firmware/HazRob

      - name: Compile ESP32-CAM HR069 for validation only
        run: arduino-cli compile --fqbn esp32:esp32:esp32cam --warnings all firmware/HazRob-CAM

# Deliberately no assembleRelease, signing, packaging, publication, upload-artifact, or firmware ZIP step.
# P13 alone may restore release artifact production after P12 qualification.
