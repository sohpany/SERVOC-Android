name: Pin HazRob Scientific Data

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/pin-scientific-data.yml'
      - 'tools/build_niosh_seed.py'
      - 'tools/build_niosh_idlh_seed.py'
      - 'tools/build_osha_z1_seed.py'

permissions:
  contents: write

jobs:
  pin-data:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main baseline
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate official scientific datasets
        run: |
          set -euo pipefail
          rm -rf app/src/main/assets/generated
          python tools/build_niosh_seed.py app/src/main/assets/generated/niosh
          python tools/build_niosh_idlh_seed.py app/src/main/assets/generated/exposure
          python tools/build_osha_z1_seed.py app/src/main/assets/generated/exposure/osha_z1

      - name: Validate generated payloads and manifests
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          pairs = [
              (Path('app/src/main/assets/generated/niosh/niosh_chemicals.json'), Path('app/src/main/assets/generated/niosh/manifest.json')),
              (Path('app/src/main/assets/generated/exposure/niosh_idlh.json'), Path('app/src/main/assets/generated/exposure/manifest.json')),
              (Path('app/src/main/assets/generated/exposure/osha_z1/osha_z1.json'), Path('app/src/main/assets/generated/exposure/osha_z1/manifest.json')),
          ]
          for payload_path, manifest_path in pairs:
              payload = json.loads(payload_path.read_text(encoding='utf-8'))
              manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
              assert payload.get('record_count', 0) > 0, payload_path
              assert manifest.get('record_count') == payload.get('record_count'), (payload_path, manifest.get('record_count'), payload.get('record_count'))
              assert manifest.get('authoritative') is True, (manifest_path, manifest.get('authoritative'))
              actual = hashlib.sha256(payload_path.read_bytes()).hexdigest()
              assert manifest.get('sha256') == actual, (payload_path, manifest.get('sha256'), actual)
              provenance = payload.get('provenance')
              if provenance is not None:
                  assert provenance.get('authoritative') is True, (payload_path, provenance)
              print(payload_path, payload.get('record_count'), manifest.get('authority') or (provenance or {}).get('authority'), actual)
          PY

      - name: Commit pinned datasets
        run: |
          set -euo pipefail
          git config user.name 'hazrob-science-bot'
          git config user.email 'hazrob-science-bot@users.noreply.github.com'
          git add app/src/main/assets/generated
          if git diff --cached --quiet; then
            echo 'Pinned scientific datasets already match generated sources.'
            exit 0
          fi
          git commit -m 'Pin authoritative HazRob scientific datasets [pin-data]'
          git push origin HEAD:main
