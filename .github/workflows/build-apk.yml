name: Build HazRob APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'dev/**'
      - 'fix/**'
    paths:
      - 'app/**'
      - 'tools/**'
      - 'signing/**'
      - '*.gradle'
      - 'gradle.properties'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Generate NIOSH chemical seed
        run: |
          python3 tools/build_niosh_seed.py app/src/main/assets/generated/niosh
          python3 - <<'PY'
          import json
          p='app/src/main/assets/generated/niosh/manifest.json'
          m=json.load(open(p,encoding='utf-8'))
          assert m['record_count'] >= 500, m
          print('NIOSH records:',m['record_count'])
          print('Source kind:',m['source_kind'])
          print('Authoritative:',m['authoritative'])
          print('NIOSH source SHA-256:',m['source_sha256'])
          print('Seed SHA-256:',m['sha256'])
          PY
      - name: Generate authoritative NIOSH IDLH seed
        run: |
          python3 tools/build_niosh_idlh_seed.py app/src/main/assets/generated/exposure
          python3 - <<'PY'
          import json
          p='app/src/main/assets/generated/exposure/manifest.json'
          m=json.load(open(p,encoding='utf-8'))
          assert m['authoritative'] is True, m
          assert m['record_count'] >= 300, m
          print('NIOSH IDLH records:',m['record_count'])
          print('NIOSH IDLH source SHA-256:',m['source_sha256'])
          print('IDLH seed SHA-256:',m['sha256'])
          PY
      - name: Generate authoritative OSHA Z-1 PEL seed
        run: |
          python3 tools/build_osha_z1_seed.py app/src/main/assets/generated/exposure/osha_z1
          python3 - <<'PY'
          import json
          p='app/src/main/assets/generated/exposure/osha_z1/manifest.json'
          m=json.load(open(p,encoding='utf-8'))
          assert m['authoritative'] is True, m
          assert m['record_count'] >= 300, m
          assert 'ACGIH TLV' in m['excluded_columns'], m
          print('OSHA Z-1 PEL records:',m['record_count'])
          print('OSHA Z-1 source SHA-256:',m['source_sha256'])
          print('OSHA seed SHA-256:',m['sha256'])
          PY
      - name: Restore HazRob prototype signing key
        run: |
          base64 -d signing/hazrob-prototype.jks.b64 > signing/hazrob-prototype.jks
          chmod 600 signing/hazrob-prototype.jks
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android platform and build tools
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Set up Gradle 9.5.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Run analytics regression tests
        run: gradle --no-daemon :app:testDebugUnitTest
      - name: Build signed release APK
        run: gradle --no-daemon :app:assembleRelease
      - name: Verify signing certificate
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          EXPECTED=d6b5b69be382f2afa6df4b46bade5b6f864f4060622e949075293ac62003d3f0
          ACTUAL=$("$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$APK" | awk -F': ' '/SHA-256 digest/ {print $2; exit}' | tr -d ': ' | tr 'A-F' 'a-f')
          test "$ACTUAL" = "$EXPECTED"
          sha256sum "$APK" | tee HazRob-v0.6.0-sha256.txt
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK" > HazRob-v0.6.0-signing.txt
      - name: Upload HazRob v0.6.0 artifact
        uses: actions/upload-artifact@v4
        with:
          name: HazRob-v0.6.0-prototype
          path: |
            app/build/outputs/apk/release/app-release.apk
            HazRob-v0.6.0-sha256.txt
            HazRob-v0.6.0-signing.txt
            app/src/main/assets/generated/niosh/manifest.json
            app/src/main/assets/generated/exposure/manifest.json
            app/src/main/assets/generated/exposure/osha_z1/manifest.json
          if-no-files-found: error
          retention-days: 30
