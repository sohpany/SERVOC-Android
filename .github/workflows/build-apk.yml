name: HazRob APK Release Hold

# P2-P12 development guard.
# The signed APK workflow is deliberately disabled while the deferred 0.10.2 / HR069
# package is under development. P13 must explicitly restore/authorize artifact production
# from one final qualified source SHA.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-hold:
    runs-on: ubuntu-latest
    steps:
      - name: Confirm deferred release hold
        run: |
          echo "HazRob 0.10.2 / HR069 APK production is locked during P2-P12."
          echo "No APK is built, signed, published, or uploaded by this workflow."
          echo "Artifact production may be restored only after P12 completion and explicit P13 unlock."
