name: Build HazRob APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'dev/**'
    paths:
      - 'app/**'
      - 'signing/**'
      - '*.gradle'
      - 'gradle.properties'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore HazRob prototype signing key
        run: |
          base64 -d signing/hazrob-prototype.jks.b64 > signing/hazrob-prototype.jks
          chmod 600 signing/hazrob-prototype.jks

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform and build tools
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.5.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Run analytics regression tests
        run: gradle --no-daemon :app:testDebugUnitTest

      - name: Build signed release APK
        run: gradle --no-daemon :app:assembleRelease

      - name: Verify signing certificate
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          EXPECTED=d6b5b69be382f2afa6df4b46bade5b6f864f4060622e949075293ac62003d3f0
          ACTUAL=$("$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$APK" | awk -F': ' '/SHA-256 digest/ {print $2; exit}' | tr -d ': ' | tr 'A-F' 'a-f')
          test "$ACTUAL" = "$EXPECTED"
          sha256sum "$APK" | tee HazRob-v0.3.0-sha256.txt
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK" > HazRob-v0.3.0-signing.txt

      - name: Upload HazRob v0.3 artifact
        uses: actions/upload-artifact@v4
        with:
          name: HazRob-v0.3.0-prototype
          path: |
            app/build/outputs/apk/release/app-release.apk
            HazRob-v0.3.0-sha256.txt
            HazRob-v0.3.0-signing.txt
          if-no-files-found: error
          retention-days: 30
