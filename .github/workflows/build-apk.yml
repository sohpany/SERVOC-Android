name: Build HazRob APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'dev/**'
      - 'fix/**'
    paths:
      - 'app/**'
      - 'firmware/**'
      - 'tools/**'
      - 'signing/**'
      - '*.gradle'
      - 'gradle.properties'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: write

concurrency:
  group: hazrob-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate pinned scientific datasets
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          datasets = [
              (Path('app/src/main/assets/generated/niosh/niosh_chemicals.json'), Path('app/src/main/assets/generated/niosh/manifest.json'), 500, 'NIOSH'),
              (Path('app/src/main/assets/generated/exposure/niosh_idlh.json'), Path('app/src/main/assets/generated/exposure/manifest.json'), 300, 'NIOSH'),
              (Path('app/src/main/assets/generated/exposure/osha_z1/osha_z1.json'), Path('app/src/main/assets/generated/exposure/osha_z1/manifest.json'), 300, 'OSHA'),
          ]
          for payload_path, manifest_path, minimum, authority in datasets:
              payload = json.loads(payload_path.read_text(encoding='utf-8'))
              manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
              count = payload.get('record_count', 0)
              assert count >= minimum, (payload_path, count)
              assert manifest.get('record_count') == count, (payload_path, manifest.get('record_count'), count)
              assert manifest.get('authoritative') is True, (manifest_path, manifest.get('authoritative'))
              actual = hashlib.sha256(payload_path.read_bytes()).hexdigest()
              assert actual == manifest.get('sha256'), (payload_path, actual, manifest.get('sha256'))
              provenance = payload.get('provenance')
              if provenance is not None:
                  assert provenance.get('authoritative') is True, (payload_path, provenance)
                  assert provenance.get('authority') == authority, (payload_path, provenance.get('authority'))
              else:
                  assert payload.get('authority') == authority, (payload_path, payload.get('authority'))
              print(f'{authority}: {count} records, SHA-256 {actual}')

          osha_manifest = json.loads(Path('app/src/main/assets/generated/exposure/osha_z1/manifest.json').read_text(encoding='utf-8'))
          assert 'ACGIH TLV' in osha_manifest.get('excluded_columns', []), osha_manifest

          chem_payload = Path('app/src/main/assets/generated/chemcore/molecular_descriptors.json')
          chem_manifest = Path('app/src/main/assets/generated/chemcore/manifest.json')
          if chem_payload.exists() or chem_manifest.exists():
              assert chem_payload.exists() and chem_manifest.exists(), 'ChemCore payload/manifest must be pinned together'
              payload = json.loads(chem_payload.read_text(encoding='utf-8'))
              manifest = json.loads(chem_manifest.read_text(encoding='utf-8'))
              assert payload.get('schema') == 'chemcore-molecular-seed-v1', payload.get('schema')
              assert payload.get('record_count') == 652, payload.get('record_count')
              assert manifest.get('record_count') == 652, manifest.get('record_count')
              assert payload.get('error_count') == 0, payload.get('error_count')
              assert payload.get('resolved_count', 0) + payload.get('unresolved_count', 0) == 652
              interpretation = payload.get('interpretation', '')
              assert 'do not imply MQ detectability' in interpretation, interpretation
              actual = hashlib.sha256(chem_payload.read_bytes()).hexdigest()
              assert actual == manifest.get('sha256'), (actual, manifest.get('sha256'))
              print(f"ChemCore molecular reference: 652 identities; resolved={payload.get('resolved_count')}; unresolved={payload.get('unresolved_count')}; SHA-256 {actual}")
          else:
              print('ChemCore molecular seed not yet pinned; application remains valid with molecular intelligence unavailable.')
          PY

      - name: Validate canonical ChemCore Stable snapshot packaging
        run: |
          OUT="$RUNNER_TEMP/chemcore-stable-snapshot-ci.json"
          python3 tools/build_chemcore_stable_snapshot.py --source-commit "$GITHUB_SHA" --out "$OUT"
          python3 - <<PY
          import json
          q=json.load(open("$OUT",encoding="utf-8"))
          assert q["schema"]=="chemcore-stable-snapshot-v1"
          assert q["content_counts"]["chemical_identities"]==652
          assert q["content_counts"]["molecularly_resolved"]==615
          assert q["content_counts"]["identity_curation_records"]==37
          assert q["policy"]["m4_requires_device_specific_validation"] is True
          print("Canonical ChemCore Stable snapshot packaging validated.")
          PY

      - name: Restore HazRob prototype signing key
        run: |
          base64 -d signing/hazrob-prototype.jks.b64 > signing/hazrob-prototype.jks
          chmod 600 signing/hazrob-prototype.jks

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform and build tools
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.5.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Run analytics regression tests
        run: gradle --no-daemon :app:testDebugUnitTest

      - name: Build signed release APK
        run: gradle --no-daemon :app:assembleRelease

      - name: Resolve release metadata
        run: |
          VERSION_NAME=$(sed -n "s/^[[:space:]]*versionName '\([^']*\)'.*/\1/p" app/build.gradle | head -1)
          VERSION_CODE=$(sed -n "s/^[[:space:]]*versionCode \([0-9][0-9]*\).*/\1/p" app/build.gradle | head -1)
          test -n "$VERSION_NAME" && test -n "$VERSION_CODE"
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"

      - name: Verify signing certificate and APK integrity
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          EXPECTED=d6b5b69be382f2afa6df4b46bade5b6f864f4060622e949075293ac62003d3f0
          ACTUAL=$("$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$APK" | awk -F': ' '/SHA-256 digest/ {print $2; exit}' | tr -d ': ' | tr 'A-F' 'a-f')
          test "$ACTUAL" = "$EXPECTED"
          sha256sum "$APK" | tee HazRob-app-sha256.txt
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK" > HazRob-app-signing.txt

      - name: Build end-user update manifest
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          APK_SHA=$(sha256sum "$APK" | awk '{print $1}')
          APK_SIZE=$(stat -c%s "$APK")
          PUBLISHED=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
          python3 - <<PY
          import json
          from pathlib import Path
          q = {
            "schema": "hazrob-app-update/1",
            "channel": "research-release",
            "version_code": int("${VERSION_CODE}"),
            "version_name": "${VERSION_NAME}",
            "package_name": "com.servoc.app",
            "min_sdk": 26,
            "apk_url": "https://hazrob-app-updates.onrender.com/HazRob-latest.apk",
            "sha256": "${APK_SHA}",
            "size_bytes": int("${APK_SIZE}"),
            "signing_cert_sha256": "d6b5b69be382f2afa6df4b46bade5b6f864f4060622e949075293ac62003d3f0",
            "published_at_utc": "${PUBLISHED}",
            "source_commit": "${GITHUB_SHA}",
            "notes": "HazRob ${VERSION_NAME}: ChemCore controlled-analysis and application update foundation."
          }
          Path('HazRob-app-update.json').write_text(json.dumps(q, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
          cat HazRob-app-update.json

      - name: Collect optional ChemCore manifest
        run: |
          if [ -f app/src/main/assets/generated/chemcore/manifest.json ]; then
            cp app/src/main/assets/generated/chemcore/manifest.json HazRob-chemcore-manifest.json
          else
            printf '%s\n' '{"status":"molecular_seed_not_pinned"}' > HazRob-chemcore-manifest.json
          fi

      - name: Publish verified APK to public distribution branch
        if: github.ref == 'refs/heads/dev/hazrob-0.10-chemcore-foundation'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin app-update-distribution
          rm -rf /tmp/hazrob-update-dist
          git worktree add -B app-update-distribution /tmp/hazrob-update-dist origin/app-update-distribution
          # Update only application-owned files. Never erase independently published
          # firmware or ChemCore directories from the shared distribution branch.
          mkdir -p /tmp/hazrob-update-dist/public
          cp app/build/outputs/apk/release/app-release.apk /tmp/hazrob-update-dist/public/HazRob-latest.apk
          cp HazRob-app-update.json /tmp/hazrob-update-dist/public/app-update.json
          cp HazRob-app-sha256.txt /tmp/hazrob-update-dist/public/HazRob-latest-sha256.txt
          cp HazRob-app-signing.txt /tmp/hazrob-update-dist/public/HazRob-latest-signing.txt
          cat > /tmp/hazrob-update-dist/public/index.html <<EOF
          <!doctype html><html><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><title>HazRob Updates</title></head><body><h1>HazRob application updates</h1><p>Latest signed build: ${VERSION_NAME} (${VERSION_CODE}).</p><p>Use the in-app Status → Update button for verified installation.</p></body></html>
          EOF
          git -C /tmp/hazrob-update-dist add -A public
          if git -C /tmp/hazrob-update-dist diff --cached --quiet; then
            echo "Public update package is already current."
          else
            git -C /tmp/hazrob-update-dist commit -m "dist(update): publish HazRob ${VERSION_NAME} (${VERSION_CODE})"
            git -C /tmp/hazrob-update-dist push origin HEAD:app-update-distribution
          fi

      - name: Upload HazRob release artifact
        uses: actions/upload-artifact@v4
        with:
          name: HazRob-${{ env.VERSION_NAME }}-prototype
          path: |
            app/build/outputs/apk/release/app-release.apk
            HazRob-app-update.json
            HazRob-app-sha256.txt
            HazRob-app-signing.txt
            HazRob-chemcore-manifest.json
            app/src/main/assets/generated/niosh/manifest.json
            app/src/main/assets/generated/exposure/manifest.json
            app/src/main/assets/generated/exposure/osha_z1/manifest.json
          if-no-files-found: error
          retention-days: 30
