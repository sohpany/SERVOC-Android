name: RETIRED - HR069 ChemCore library publisher - DO NOT PUBLISH

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retired-workflow:
    runs-on: ubuntu-latest
    steps:
      - name: Fail closed - controlled publication required
        shell: bash
        run: |
          echo "::error::This legacy ChemCore publication workflow is retired under CR-20261004-009."
          echo "No library/data/distribution publication may occur without a registered and approved HazRob Change Record."
          echo "Current authority: HazRob/build-harness/CURRENT_RELEASE_AUTHORITY.md"
          echo "Policy: HazRob/build-harness/docs/HAZROB_MANDATORY_CHANGE_CONTROL_AND_RELEASE_POLICY_2026-10-04.md"
          echo "Canonical analytical corpus: research_data/hr069_analytical_library/"
          exit 1
