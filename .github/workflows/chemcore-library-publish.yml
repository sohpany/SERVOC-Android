name: Publish ChemCore Stable Library Bundle

on:
  workflow_dispatch:
    inputs:
      library_version:
        description: Semantic ChemCore library version, e.g. 1.0.0
        required: true
      payload_path:
        description: Repository path to approved JSON/SQLite payload
        required: true
        default: app/src/main/assets/generated/chemcore/molecular_descriptors.json
      payload_format:
        description: json or sqlite
        required: true
        default: json
      chemical_count:
        description: Number of chemical identities represented by the payload
        required: true
        default: '652'
      source_count:
        description: Number of source/provenance records
        required: true
        default: '0'
      model_count:
        description: Number of model artifacts
        required: true
        default: '0'
      calibration_count:
        description: Number of device calibration artifacts
        required: true
        default: '0'

permissions:
  contents: read

jobs:
  publish-stable-bundle:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact source revision
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Require publication signing secret
        env:
          PRIVATE_KEY_PEM: ${{ secrets.CHEMCORE_PUBLICATION_PRIVATE_KEY_PEM }}
        run: |
          if [ -z "$PRIVATE_KEY_PEM" ]; then
            echo "CHEMCORE_PUBLICATION_PRIVATE_KEY_PEM is not configured."
            exit 1
          fi
          umask 077
          printf '%s\n' "$PRIVATE_KEY_PEM" > "$RUNNER_TEMP/chemcore-publication-private.pem"
          openssl pkey -in "$RUNNER_TEMP/chemcore-publication-private.pem" -check -noout

      - name: Validate requested payload
        env:
          PAYLOAD: ${{ inputs.payload_path }}
          FORMAT: ${{ inputs.payload_format }}
        run: |
          test -f "$PAYLOAD"
          case "$FORMAT" in
            json) python3 -m json.tool "$PAYLOAD" >/dev/null ;;
            sqlite) sqlite3 "$PAYLOAD" 'PRAGMA quick_check;' | grep -qx ok ;;
            *) echo "Unsupported payload_format: $FORMAT"; exit 1 ;;
          esac

      - name: Build signed immutable publication bundle
        env:
          PAYLOAD: ${{ inputs.payload_path }}
          FORMAT: ${{ inputs.payload_format }}
          LIB_VERSION: ${{ inputs.library_version }}
          CHEMICAL_COUNT: ${{ inputs.chemical_count }}
          SOURCE_COUNT: ${{ inputs.source_count }}
          MODEL_COUNT: ${{ inputs.model_count }}
          CALIBRATION_COUNT: ${{ inputs.calibration_count }}
        run: |
          python3 tools/publish_chemcore_library.py \
            --payload "$PAYLOAD" \
            --out-dir "$RUNNER_TEMP/chemcore-stable" \
            --library-version "$LIB_VERSION" \
            --source-commit "$GITHUB_SHA" \
            --channel stable \
            --payload-format "$FORMAT" \
            --min-app-version 0.9.3-rc2 \
            --feature-schema chemcore-features/1 \
            --sampling-profile hazrob-chemcore-chamber-v2 \
            --chemical-count "$CHEMICAL_COUNT" \
            --source-count "$SOURCE_COUNT" \
            --model-count "$MODEL_COUNT" \
            --calibration-count "$CALIBRATION_COUNT" \
            --private-key "$RUNNER_TEMP/chemcore-publication-private.pem"

      - name: Verify publication signature with derived public key
        run: |
          openssl pkey -in "$RUNNER_TEMP/chemcore-publication-private.pem" -pubout -out "$RUNNER_TEMP/chemcore-publication-public.pem"
          python3 - <<'PY'
          import base64, json, pathlib, subprocess, tempfile
          root = pathlib.Path(__import__('os').environ['RUNNER_TEMP']) / 'chemcore-stable'
          m = json.loads((root/'manifest.json').read_text())
          rows = [
              ('library_version',m['library_version']),('schema_version',str(m['schema_version'])),
              ('channel',m['channel'].lower()),('created_utc',m['created_utc']),
              ('source_commit_sha',m['source_commit_sha']),('payload_file',m['payload_file']),
              ('payload_format',m['payload_format'].lower()),('payload_sha256',m['payload_sha256'].lower()),
              ('payload_size_bytes',str(m['payload_size_bytes'])),('chemical_count',str(m['chemical_count'])),
              ('source_count',str(m['source_count'])),('model_count',str(m['model_count'])),
              ('calibration_count',str(m['calibration_count'])),('min_app_version',m['min_app_version']),
              ('max_app_version',m.get('max_app_version','')),('feature_schema_version',m['feature_schema_version']),
              ('sampling_profile_compatibility',','.join(sorted(m.get('sampling_profile_compatibility',[])))),
              ('signature_algorithm',m['signature_algorithm'])]
          canonical='chemcore-manifest-v1\n'+''.join(f'{k}={v}\n' for k,v in rows)
          with tempfile.TemporaryDirectory() as td:
              td=pathlib.Path(td); (td/'m.txt').write_text(canonical); (td/'sig.bin').write_bytes(base64.b64decode(m['signature']))
              subprocess.run(['openssl','dgst','-sha256','-verify',str(pathlib.Path(__import__('os').environ['RUNNER_TEMP'])/'chemcore-publication-public.pem'),'-signature',str(td/'sig.bin'),str(td/'m.txt')],check=True)
          PY

      - name: Upload signed stable bundle
        uses: actions/upload-artifact@v4
        with:
          name: ChemCore-Stable-${{ inputs.library_version }}
          path: ${{ runner.temp }}/chemcore-stable/
          if-no-files-found: error
          retention-days: 90
